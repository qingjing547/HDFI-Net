# HDFI-Net: hierarchical differentiation and feature interaction.
# This configuration retains the executable settings of the research model.
# DLB: layers 2/4; GEB: 6/8/22; FCFB: 13/16/19; DBID: 3/5/7/17/20.
# Repeats and channels below are scaled by the n depth/width multipliers.
nc: 5
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1 P2/4
  - [-1, 2, DLB, [256, False, 0.375]]          # 2
  - [-1, 1, DBID, [256]]                       # 3 P3/8
  - [-1, 2, DLB, [512, False, 0.375]]          # 4
  - [-1, 1, DBID, [512]]                       # 5 P4/16
  - [-1, 2, GEB, [512, True, 0.5]]             # 6
  - [-1, 1, DBID, [1024]]                      # 7 P5/32
  - [-1, 4, GEB, [1024, True, 0.52]]           # 8
  - [-1, 1, SPPF, [1024, 5]]                   # 9
  - [-1, 2, C2PSA, [1024]]                     # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]    # 11
  - [[-1, 6], 1, Concat, [1]]                 # 12
  - [-1, 2, FCFB, [512, False, 0.5]]           # 13
  - [-1, 1, nn.Upsample, [None, 2, nearest]]    # 14
  - [[-1, 4], 1, Concat, [1]]                 # 15
  - [-1, 4, FCFB, [256, False, 0.625]]         # 16 P3/8
  - [-1, 1, DBID, [256]]                       # 17
  - [[-1, 13], 1, Concat, [1]]                # 18
  - [-1, 2, FCFB, [512, False, 0.5]]           # 19 P4/16
  - [-1, 1, DBID, [512]]                       # 20
  - [[-1, 10], 1, Concat, [1]]                # 21
  - [-1, 2, GEB, [1024, True, 0.5]]            # 22 P5/32
  - [[16, 19, 22], 1, Detect, [nc]]            # 23
